<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Watch</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="watch-page">
    <header class="top compact">
      <a href="/" class="back">← Catalog</a>
      <h1 id="title">Loading…</h1>
    </header>
    <section class="player-wrap">
      <iframe id="player" title="Stream player" allowfullscreen allow="autoplay; fullscreen"></iframe>
      <p id="embed-note" class="muted hidden">
        This host blocks embedding on other sites. Use the button below to open the official player tab.
      </p>
      <div class="actions">
        <a id="open-tab" class="btn primary" href="#" target="_blank" rel="noopener noreferrer">Open stream in new tab</a>
        <a id="source-link" class="btn" href="#" target="_blank" rel="noopener noreferrer">View on CineFreak</a>
      </div>
      <div id="episode-list" class="episode-list"></div>
      <ul id="alt-links" class="alt-links"></ul>
    </section>
    <script type="module" src="/watch.js"></script>
  </body>
</html>
